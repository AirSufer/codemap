<!-- codemap client. No external resources: the spec commits to zero network
     calls, so this is hand-written vanilla JS against the Nocturne palette. -->
<meta charset="utf-8">
<title>codemap</title>
<style>
:root{
  --bg:#0e1017; --surface:#171a25; --surface2:#1c2030; --line:#252a3a;
  --text:#dfe3ec; --dim:#7b8397; --dimmer:#565e73;
  --agent:#f2b45a; --route:#6fd3a0; --class:#7fb0ff; --module:#9184d9;
  --dep:#5fd0d4; --warn:#ee8a63;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(1200px 700px at 30% -10%,#171a2a 0%,var(--bg) 60%);
     color:var(--text);font:13px var(--mono);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh}

/* ---- header ---- */
header{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand i{width:9px;height:9px;border-radius:2px;background:var(--module);display:inline-block}
.path{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw;direction:rtl;text-align:left}
.spacer{flex:1}
.hstat{color:var(--dim);font-size:12px;white-space:nowrap}
.hstat b{color:var(--text);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.on{background:var(--agent);animation:pulse 2.4s ease-out infinite}
.dot.off{background:var(--dimmer)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,180,90,.5)}70%{box-shadow:0 0 0 5px rgba(242,180,90,0)}}
#follow{border:1px solid var(--line);background:var(--surface);color:var(--dim);
        padding:5px 11px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px}
#follow.on{background:var(--agent);border-color:var(--agent);color:#17130a;font-weight:600}

/* ---- 3 panes ---- */
main{flex:1;display:flex;min-height:0}
#outline{width:270px;flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#search{margin:12px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);
        border-radius:6px;color:var(--text);font:inherit;font-size:12px;outline:none}
#search:focus{border-color:var(--module)}
.olhead{display:flex;justify-content:space-between;padding:0 14px 8px;color:var(--dimmer);
        font-size:10px;letter-spacing:.1em;text-transform:uppercase}
#tree{flex:1;overflow:auto;padding-bottom:20px}
.row{display:flex;align-items:center;gap:7px;padding:3px 14px;cursor:pointer;white-space:nowrap}
.row:hover{background:var(--surface)}
.row.sel{background:var(--surface2)}
.row.act{color:var(--agent)}
.tw{width:10px;color:var(--dimmer);flex:0 0 10px;font-size:9px}
.kd{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
.row .nm{overflow:hidden;text-overflow:ellipsis}
.row .ct{margin-left:auto;color:var(--dimmer);font-size:11px}
.k-package{background:var(--module)} .k-module{background:var(--module);opacity:.6}
.k-class{background:var(--class)} .k-function{background:var(--dim);border-radius:50%}
.k-route{background:var(--route);border-radius:50%}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow-x:hidden;overflow-y:auto}
#crumbs{padding:14px 22px 0;color:var(--dim);font-size:12px}
#crumbs span{cursor:pointer} #crumbs span:hover{color:var(--text)}
#crumbs b{color:var(--text);font-weight:500}
#title{padding:6px 22px 2px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#title h1{margin:0;font-size:27px;font-weight:500;letter-spacing:-.01em}
.badge{padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--dim);font-size:11px}
#here{color:var(--agent);font-size:12px}
#nb{margin:16px 22px 0;position:relative;min-height:170px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{min-width:0}
.col h5{margin:0 0 10px;color:var(--dimmer);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.pill{display:flex;align-items:center;gap:6px;padding:6px 9px;margin-bottom:6px;border-radius:6px;
      background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:12px}
.pill:hover{border-color:var(--module)}
.pill.this{border-color:var(--agent);background:#2a2113}
.pill.route{border-color:#2f5f47}
.pill .f{margin-left:auto;color:var(--dimmer);font-size:10px;flex:0 100000 auto;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.pill .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.none{color:var(--dimmer);font-size:12px;padding:6px 0}
.legend{margin:14px 22px 0;color:var(--dimmer);font-size:11px;display:flex;gap:16px;flex-wrap:wrap}
#trail{margin:22px 22px 26px;border-top:1px solid var(--line);padding-top:14px}
.th{display:flex;justify-content:space-between;color:var(--dimmer);font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:15px;
      background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:12px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--agent)}
.chip .ago{color:var(--dimmer);font-size:11px}

#panel{width:370px;flex:0 0 auto;min-width:0;border-left:1px solid var(--line);overflow:auto;padding:16px 18px 40px}
.sec{margin-bottom:22px}
.sec h4{margin:0 0 9px;color:var(--dimmer);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.qn{font-size:15px;word-break:break-all;margin-bottom:5px}
.loc{color:var(--dim);font-size:12px}
.loc a{color:var(--dep);cursor:pointer;text-decoration:none}
.prose{color:var(--dim);font-size:12px;line-height:1.65}
.stats{display:flex;gap:22px;margin-bottom:10px}
.stat b{display:block;font-size:22px;font-weight:500;line-height:1.25}
.stat span{color:var(--dimmer);font-size:11px}
.stat.u b{color:var(--warn)}
pre{margin:0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
    overflow:auto;max-height:260px;font-size:11px;line-height:1.55;color:#aeb6c6}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:var(--surface);color:var(--text);
             padding:5px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:11px}
.acts button:hover{border-color:var(--agent);color:var(--agent)}
.deps{display:flex;flex-wrap:wrap;gap:5px}
.dtag{padding:2px 7px;border-radius:4px;background:var(--surface);border:1px solid var(--line);
      color:var(--dep);font-size:11px}
#empty{color:var(--dimmer);padding:60px 20px;text-align:center;line-height:1.7}
@media (max-width:1240px){ #panel{width:310px} #outline{width:225px} }
@media (max-width:1040px){ #panel{width:270px} #outline{width:200px} .cols{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px} }
</style>

<div id="app">
  <header>
    <div class="brand"><i></i>codemap</div>
    <div class="path" id="root">—</div>
    <div class="spacer"></div>
    <div class="hstat" id="agentst"></div>
    <div class="hstat" id="counts"></div>
    <button id="follow" class="on">Following</button>
  </header>
  <main>
    <div id="outline">
      <input id="search" placeholder="Search symbols, files…   /">
      <div class="olhead"><span>Outline</span><span id="ncount"></span></div>
      <div id="tree"></div>
    </div>
    <div id="center">
      <div id="crumbs"></div>
      <div id="title"></div>
      <div id="nb"></div>
      <div class="legend"></div>
      <div id="trail"></div>
    </div>
    <div id="panel"><div id="empty">Select a symbol to inspect it.</div></div>
  </main>
</div>

<script>
const KIND = {package:'package',module:'module',class:'class',function:'function',route:'route'};
let G={nodes:[],edges:[],root:''}, byId=new Map(), kids=new Map(),
    calls=new Map(), rcalls=new Map(), routesTo=new Map();
let focus={active:null,ancestors:[],trail:[],following:true,agent:'fs',last_event_secs:null};
let sel=null, expanded=new Set(), detail=null, ws, query='';

const el = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const short = f => (f||'').split('/').pop();

function ingest(p){
  G=p; byId=new Map(); kids=new Map(); calls=new Map(); rcalls=new Map();
  for(const n of G.nodes) byId.set(n.id,n);
  for(const n of G.nodes){
    const k = n.parent==null?'root':n.parent;
    if(!kids.has(k)) kids.set(k,[]);
    kids.get(k).push(n.id);
  }
  for(const e of G.edges){
    if(e.kind!=='calls') continue;
    (calls.get(e.from)||calls.set(e.from,[]).get(e.from)).push(e.to);
    (rcalls.get(e.to)||rcalls.set(e.to,[]).get(e.to)).push(e.from);
  }
  el('root').textContent = G.root;
  el('counts').innerHTML = `<b>${G.nodes.length}</b> nodes · <b>${G.edges.length}</b> edges · watching`;
  el('ncount').textContent = G.nodes.length + ' nodes';
  renderTree();
}
const childrenOf = id => kids.get(id==null?'root':id) || [];

/* ---------- outline ---------- */
function matches(id){
  if(!query) return true;
  const n=byId.get(id); if(!n) return false;
  if(n.name.toLowerCase().includes(query) || n.qualified_name.toLowerCase().includes(query)) return true;
  return childrenOf(id).some(matches);
}
function renderTree(){
  const out=[];
  const walk=(id,depth)=>{
    const n=byId.get(id); if(!n || !matches(id)) return;
    const ch=childrenOf(id);
    const open = expanded.has(id) || (query && ch.length);
    out.push(`<div class="row ${sel===id?'sel':''} ${focus.active===id?'act':''}" data-id="${id}"
      style="padding-left:${10+depth*13}px">
      <span class="tw">${ch.length?(open?'▾':'▸'):''}</span>
      <span class="kd k-${n.kind}"></span>
      <span class="nm">${esc(n.name)}</span>
      ${ch.length?`<span class="ct">${ch.length}</span>`:''}
    </div>`);
    if(open) ch.forEach(c=>walk(c,depth+1));
  };
  childrenOf(null).forEach(id=>walk(id,0));
  el('tree').innerHTML = out.join('');
  el('tree').querySelectorAll('.row').forEach(r=>{
    r.onclick = e => {
      const id=+r.dataset.id;
      if(childrenOf(id).length && e.offsetX < 26+13*3){ expanded.has(id)?expanded.delete(id):expanded.add(id); renderTree(); return; }
      select(id,true);
    };
  });
}
el('search').oninput = e => { query=e.target.value.toLowerCase(); renderTree(); };
addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape'){e.target.blur();} return; }
  if(e.key==='/'){ e.preventDefault(); el('search').focus(); }
  if(e.key==='f') setFollow(!focus.following);
  if(e.key==='Escape'){ const n=byId.get(sel); if(n && n.parent!=null) select(n.parent,true); }
});

/* ---------- centre ---------- */
function chain(id){ const o=[]; let c=id,g=0; while(c!=null && g++<64){o.unshift(c); const n=byId.get(c); c=n?n.parent:null;} return o; }

function renderCenter(){
  const id = sel!=null ? sel : focus.active;
  const n = byId.get(id);
  if(!n){ el('crumbs').innerHTML=''; el('title').innerHTML=''; el('nb').innerHTML=''; return; }

  el('crumbs').innerHTML = chain(id).slice(0,-1).map(c=>{
    const nn=byId.get(c); if(!nn) return '';
    return `<span data-c="${c}">${esc(nn.name)}</span>`;
  }).filter(Boolean).join(' <span style="color:#3a4157">/</span> ');
  el('crumbs').querySelectorAll('[data-c]').forEach(s=>s.onclick=()=>select(+s.dataset.c,true));

  el('title').innerHTML = `<h1>${esc(n.name)}</h1><span class="badge">${n.kind}</span>` +
    (focus.active===id ? `<span id="here">the agent is here now</span>` : '');

  const pill = (cid, cls) => {
    const c=byId.get(cid); if(!c) return '';
    return `<div class="pill ${cls||''}" data-go="${cid}"><span class="nm">${esc(c.name)}</span><span class="f">${esc(short(c.file))}</span></div>`;
  };
  const routes = (detail && detail.id===id) ? detail.routes : [];
  const callers = (rcalls.get(id)||[]);
  const callees = (calls.get(id)||[]);
  el('nb').innerHTML = `<div class="cols">
    <div class="col"><h5>routes</h5>${routes.length?routes.map(r=>pill(r,'route')).join(''):'<div class="none">no route found</div>'}</div>
    <div class="col"><h5>called by</h5>${callers.length?callers.slice(0,6).map(c=>pill(c)).join(''):'<div class="none">—</div>'}</div>
    <div class="col"><h5>this</h5>${pill(id,'this')}</div>
    <div class="col"><h5>calls</h5>${callees.length?callees.slice(0,6).map(c=>pill(c)).join(''):'<div class="none">—</div>'}</div>
  </div>`;
  el('nb').querySelectorAll('[data-go]').forEach(p=>p.onclick=()=>select(+p.dataset.go,true));
  document.querySelector('.legend').innerHTML =
    `<span>click to move · Esc up · f follow</span>`;
}

function renderTrail(){
  const items = focus.trail.map(t=>{
    const n=byId.get(t.node); if(!n) return '';
    const a=t.ago_secs;
    const ago = a<2?'now' : a<60?`${a}s ago` : a<3600?`${Math.round(a/60)}m ago` : `${Math.round(a/3600)}h ago`;
    return `<div class="chip" data-go="${t.node}" style="opacity:${(.35+t.weight*.65).toFixed(2)}">
      <i style="opacity:${t.weight.toFixed(2)}"></i>${esc(n.name)}<span class="ago">${ago}</span></div>`;
  }).filter(Boolean).join('');
  el('trail').innerHTML = `<div class="th"><span>Session trail</span><span>fades on a 90s half-life</span></div>
    <div class="chips">${items||'<div class="none">nothing yet — the trail fills as your agent works</div>'}</div>`;
  el('trail').querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>select(+c.dataset.go,true));
}

/* ---------- inspector ---------- */
function renderPanel(d){
  if(!d || d.id!==(sel!=null?sel:focus.active)) return;
  const first = !detail || detail.id!==d.id;
  detail=d;
  // Routes live in the detail message, so the centre column has to redraw
  // once it lands or it keeps showing "no route found" for a routed symbol.
  if(first) renderCenter();
  const n=byId.get(d.id)||{};
  const total = d.resolved_calls + d.unresolved_calls;
  const pct = total ? Math.round(100*d.resolved_calls/total) : 100;
  const routeBlock = d.routes.length
    ? `<div class="prose">Reached from ${d.routes.length} route${d.routes.length>1?'s':''}.</div>
       <div class="acts" style="margin-top:8px">${d.routes.map(r=>`<button data-go="${r}">${esc((byId.get(r)||{}).name||'?')}</button>`).join('')}</div>`
    : `<div class="prose"><b style="color:var(--text)">No route found.</b> That means unknown, not
        unreachable — call edges are read from syntax, not types.</div>`;
  const deps = d.dependencies.length
    ? `<div class="deps">${d.dependencies.map(x=>`<span class="dtag">${esc(x)}</span>`).join('')}</div>`
    : `<div class="prose">Standard library and this repo only — nothing external here.</div>`;

  el('panel').innerHTML =
    `<div class="sec">
       <div class="qn">${esc(n.name||d.qualified_name)}</div>
       <div class="loc" style="word-break:break-all;margin-bottom:4px">${esc(d.qualified_name)}</div>
       <div class="loc">${esc(short(d.file))}:${d.line_start} · <a id="oe">open in editor ↗</a></div>
     </div>
     <div class="sec"><h4>how you get here</h4>${routeBlock}</div>
     <div class="sec"><h4>what codemap knows here</h4>
       <div class="stats">
         <div class="stat"><b>${(rcalls.get(d.id)||[]).length}</b><span>callers</span></div>
         <div class="stat"><b>${d.resolved_calls}</b><span>calls resolved</span></div>
         <div class="stat u"><b>${d.unresolved_calls}</b><span>unresolved</span></div>
       </div>
       <div class="prose">${pct}% of call sites in this node resolved.${d.unresolved_calls?
         ' The rest go through values whose type is not inferred, so a caller or route may exist that codemap cannot see.':''}</div>
     </div>
     <div class="sec"><h4>dependencies</h4>${deps}</div>
     <div class="sec"><h4>source</h4><pre>${esc(d.source)}</pre></div>
     <div class="sec"><h4>ask the agent</h4>
       <div class="acts">${['explain','write tests','find bugs','refactor','trace callers']
         .map(i=>`<button data-i="${i}">${i}</button>`).join('')}</div>
       <div class="prose" style="margin-top:8px">Types the prompt into your agent's pane.
         Nothing is submitted until you press Enter.</div>
     </div>`;
  el('panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(+b.dataset.go,true));
  el('panel').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    send({type:'send_to_agent', prompt:`${b.dataset.i} ${d.qualified_name} (${d.file}:${d.line_start})`});
    const t=b.textContent; b.textContent='sent ✓'; setTimeout(()=>b.textContent=t,1200);
  });
  const oe=el('oe'); if(oe) oe.onclick=()=>send({type:'open_editor',file:d.file,line:d.line_start});
}

function select(id, detach){
  sel=id;
  if(detach) setFollow(false);
  for(const a of chain(id)) expanded.add(a);
  send({type:'detail', id});
  renderTree(); renderCenter();
}

/* ---------- focus ---------- */
function applyFocus(f){
  focus=f;
  const b=el('follow');
  b.classList.toggle('on', f.following);
  b.textContent = f.following ? 'Following' : 'Detached';
  const ago = f.last_event_secs==null ? '' :
    f.last_event_secs<2?'just now':f.last_event_secs<60?`${f.last_event_secs}s ago`:`${Math.round(f.last_event_secs/60)}m ago`;
  el('agentst').innerHTML = f.active==null
    ? `<span class="dot off"></span>waiting for your agent`
    : `<span class="dot ${f.following?'on':'off'}"></span>${f.following?'Following':'Detached ·'} <b>${esc(f.agent)}</b>${ago?` · last event ${ago}`:''}`;
  if(f.following && f.active!=null){ sel=null; for(const a of chain(f.active)) expanded.add(a); }
  // Always fill the inspector for whatever is on screen. Requiring a click
  // left the panel reading "Select a symbol" while the centre showed a symbol.
  const showing = sel!=null ? sel : f.active;
  if(showing!=null && (!detail || detail.id!==showing)) send({type:'detail', id:showing});
  renderTree(); renderCenter(); renderTrail();
}
function setFollow(on){ if(focus.following!==on) send({type:'follow', on}); }
el('follow').onclick = ()=> setFollow(!focus.following);

/* ---------- socket ---------- */
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)); }
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = ev => {
    const m=JSON.parse(ev.data);
    if(m.type==='graph') ingest(m);
    else if(m.type==='focus') applyFocus(m);
    else if(m.type==='detail') renderPanel(m);
  };
  ws.onclose=()=>{ el('counts').textContent='disconnected — retrying'; setTimeout(connect,1200); };
}
connect();
setInterval(()=>{ if(focus.trail.length) renderTrail(); }, 5000);
</script>
