<!-- codemap client. Zero external resources: the spec commits to no network
     calls, so the 3D tree is hand-written canvas against the Nocturne palette. -->
<meta charset="utf-8">
<title>codemap</title>
<style>
:root{
  --bg:#0e1017; --surface:#171a25; --surface2:#1c2030; --line:#252a3a;
  --text:#dfe3ec; --dim:#7b8397; --dimmer:#565e73;
  --agent:#f2b45a; --agent-mid:#8a6a33; --agent-dim:#3a2d17;
  --route:#6fd3a0; --route-dim:#2f5f47; --class:#7fb0ff; --module:#9184d9;
  --dep:#5fd0d4; --warn:#ee8a63;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(1200px 700px at 30% -10%,#171a2a 0%,var(--bg) 60%);
     color:var(--text);font:13px var(--mono);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand i{width:9px;height:9px;border-radius:2px;background:var(--agent);display:inline-block}
.path{color:var(--dim);overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.spacer{flex:1}
.hstat{color:var(--dim);font-size:12px;white-space:nowrap}
.hstat b{color:var(--text);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.on{background:var(--agent);animation:pulse 2.4s ease-out infinite}
.dot.off{background:var(--dimmer)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,180,90,.5)}70%{box-shadow:0 0 0 5px rgba(242,180,90,0)}}
#follow{border:1px solid var(--line);background:var(--surface);color:var(--dim);padding:5px 11px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px}
#follow.on{background:var(--agent);border-color:var(--agent);color:#17130a;font-weight:600}

main{flex:1;display:flex;min-height:0}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{display:flex;align-items:center;gap:16px;padding:12px 18px 0;flex:0 0 auto}
#search{width:250px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;font-size:12px;outline:none}
#search:focus{border-color:var(--module)}
#crumbs{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumbs span{cursor:pointer} #crumbs span:hover{color:var(--text)}
#crumbs b{color:var(--text);font-weight:500}
#title{padding:8px 18px 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;flex:0 0 auto}
#title h1{margin:0;font-size:29px;font-weight:400;letter-spacing:-.01em}
.badge{padding:2px 9px;border-radius:5px;border:1px solid var(--agent-mid);color:var(--agent);font-size:11px}
#here{color:var(--agent);font-size:12px}
#canvasWrap{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%;cursor:grab}
#sugg{position:absolute;top:44px;left:18px;width:250px;max-height:280px;overflow:auto;z-index:5;
      background:var(--surface);border:1px solid var(--line);border-radius:6px;display:none}
#sugg div{padding:6px 10px;cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sugg div:hover,#sugg div.on{background:var(--surface2)}
#sugg .k{color:var(--dimmer);font-size:10px;margin-right:6px}
#ctrls{display:flex;align-items:center;gap:6px;padding:8px 18px;flex:0 0 auto;flex-wrap:wrap}
.lvl{border:1px solid transparent;background:none;color:var(--dimmer);padding:3px 8px;border-radius:5px;cursor:pointer;font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.lvl.on{color:var(--text);border-color:var(--line);background:var(--surface)}
#fit{margin-left:auto;display:flex;gap:14px}
#fit button{background:none;border:none;color:var(--dep);cursor:pointer;font:inherit;font-size:12px}
#fit button:hover{color:var(--text)}
#legend{display:flex;gap:15px;padding:0 18px 8px;color:var(--dimmer);font-size:11px;flex-wrap:wrap;align-items:center;flex:0 0 auto}
#legend i{display:inline-block;margin-right:5px}
#hint{margin-left:auto;color:var(--dimmer);font-size:11px}
#trail{border-top:1px solid var(--line);padding:12px 18px 14px;flex:0 0 auto;max-height:120px;overflow:auto}
.th{display:flex;justify-content:space-between;color:var(--dimmer);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:15px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:12px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--agent)}
.chip .ago{color:var(--dimmer);font-size:11px}

#panel{width:340px;flex:0 0 auto;border-left:1px solid var(--line);overflow:auto;padding:16px 18px 40px}
.sec{margin-bottom:22px}
.sec h4{margin:0 0 9px;color:var(--dimmer);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;display:flex;gap:8px;align-items:baseline}
.sec h4 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--dimmer);font-weight:400}
.prose{color:var(--dim);font-size:12.5px;line-height:1.65}
.prose b{color:var(--text);font-weight:500}
.sig{margin:9px 0;padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
     color:var(--text);font-size:11.5px;line-height:1.5;word-break:break-word}
.loc{color:var(--dim);font-size:12px;margin-top:8px}
.loc a{color:var(--dep);cursor:pointer}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hop{padding:3px 9px;border:1px solid var(--line);border-radius:5px;cursor:pointer;font-size:11.5px;color:var(--text)}
.hop.route{border-color:var(--route-dim);color:var(--route)}
.hop.last{border-color:var(--agent-mid);background:var(--agent-dim);color:var(--agent)}
.arrow{color:var(--dimmer);font-size:11px}
.stats{display:flex;gap:22px;margin-bottom:10px}
.stat b{display:block;font-size:23px;font-weight:400;line-height:1.25}
.stat span{color:var(--dimmer);font-size:11px}
.stat.u b{color:var(--warn)}
.bar{height:3px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--route)}
pre{margin:0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:240px;font-size:11px;line-height:1.55;color:#aeb6c6}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:11px}
.acts button:hover{border-color:var(--agent);color:var(--agent)}
.deps{display:flex;flex-wrap:wrap;gap:5px}
.dtag{padding:2px 7px;border-radius:4px;background:var(--surface);border:1px solid var(--line);color:var(--dep);font-size:11px}
.warnt{color:var(--warn)}
#empty{color:var(--dimmer);padding:60px 20px;text-align:center;line-height:1.7}
@media (max-width:1200px){ #panel{width:300px} }
</style>

<div id="app">
  <header>
    <div class="brand"><i></i>codemap</div>
    <div class="path" id="root">—</div>
    <div class="spacer"></div>
    <div class="hstat" id="agentst"></div>
    <div class="hstat" id="counts"></div>
    <button id="follow" class="on">Following</button>
  </header>
  <main>
    <div id="stage">
      <div id="topbar">
        <input id="search" placeholder="Jump to symbol, file, route     /">
        <div id="crumbs"></div>
      </div>
      <div id="sugg"></div>
      <div id="title"></div>
      <div id="canvasWrap"><canvas id="c"></canvas></div>
      <div id="ctrls">
        <button class="lvl on" data-lvl="0">project</button>
        <button class="lvl on" data-lvl="1">↓ crates</button>
        <button class="lvl on" data-lvl="2">↓ files open on select</button>
        <button class="lvl" data-lvl="3">↓ symbols</button>
        <div id="fit"><button id="fitAll">whole tree</button><button id="fitSel">to selection</button></div>
      </div>
      <div id="legend">
        <span><i style="width:7px;height:7px;border-radius:50%;background:var(--agent)"></i>agent</span>
        <span><i style="width:7px;height:7px;border-radius:50%;border:1px solid var(--route)"></i>route</span>
        <span><i style="width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--class)"></i>class</span>
        <span><i style="width:7px;height:7px;background:var(--module)"></i>module</span>
        <span><i style="width:7px;height:7px;border-radius:50%;background:var(--dep)"></i>dependency</span>
        <span><i style="width:14px;height:0;border-top:1px dashed var(--dimmer);position:relative;top:-3px"></i>reachable</span>
        <span id="hint">drag to orbit · wheel to zoom · hover for detail · click to select · f follow</span>
      </div>
      <div id="trail"></div>
    </div>
    <div id="panel"><div id="empty">Waiting for your agent, or pick a node.</div></div>
  </main>
</div>

<script>
const KC = {package:'#9184d9',module:'#9184d9',class:'#7fb0ff',function:'#7a7f95',route:'#6fd3a0',project:'#f2b45a'};
const DIMC = {package:'#3b3a5c',module:'#3b3a5c',class:'#34496d',function:'#3a3f52',route:'#2f5f47',project:'#5a4520'};
let G={nodes:[],edges:[],root:''}, byId=new Map(), kids=new Map(), calls=new Map(), rcalls=new Map();
let focus={active:null,ancestors:[],trail:[],following:true,agent:'fs',last_event_secs:null};
let sel=null, detail=null, ws, expanded=new Set(), levels={0:true,1:true,2:true,3:false};
let P=new Map(), cam={yaw:0,pitch:.28,tx:0,ty:0,tz:0,dist:2200},
    goal={yaw:0,pitch:.28,tx:0,ty:0,tz:0,dist:2200}, hit=null, hoverId=null, mouse=null, rects=[], userMoved=false;

const el=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shortf=f=>(f||'').split('/').pop();
const cur=()=>sel!=null?sel:focus.active;

/* ================= data ================= */
function ingest(p){
  G=p; byId=new Map(); kids=new Map(); calls=new Map(); rcalls=new Map();
  for(const n of G.nodes) byId.set(n.id,n);
  for(const n of G.nodes){ const k=n.parent==null?'root':n.parent;
    if(!kids.has(k)) kids.set(k,[]); kids.get(k).push(n.id); }
  for(const e of G.edges){ if(e.kind!=='calls') continue;
    if(!calls.has(e.from)) calls.set(e.from,[]); calls.get(e.from).push(e.to);
    if(!rcalls.has(e.to)) rcalls.set(e.to,[]); rcalls.get(e.to).push(e.from); }
  el('root').textContent=G.root;
  el('counts').innerHTML=`<b>${G.nodes.length}</b> nodes · <b>${G.edges.length}</b> edges · watching`;
  layout(); fitAll();
}
const childrenOf=id=>kids.get(id==null?'root':id)||[];
function chain(id){const o=[];let c=id,g=0;while(c!=null&&g++<64){o.unshift(c);const n=byId.get(c);c=n?n.parent:null;}return o;}

/* ================= 3D layout =================
   Depth reads top to bottom: project, then packages, then files fanned on an
   arc, then symbols below each file. */
function layout(){
  P=new Map(); P.set('root',{x:0,y:-260,z:0});
  const pk=childrenOf(null);
  const spread=Math.max(460, Math.min(900, 5600/Math.max(pk.length,1)));
  pk.forEach((id,i)=>{
    const x=(i-(pk.length-1)/2)*spread;
    P.set(id,{x,y:0,z:0});
    place({x,y:0,z:0}, childrenOf(id), spread*0.46, 300, 1);
  });
}
// Recurse the whole tree. Stopping early left deeply nested symbols with no
// position at all, so the camera had nothing to fly to and they never drew.
function place(origin, ids, radius, dy, depth){
  const n=ids.length; if(!n || depth>10) return;
  // Arc radius has to grow with sibling count or labels collide: chord spacing
  // is roughly radius * (span / n), and a label needs ~180 world units.
  const SPAN=2.1, NEED=180;
  const R = Math.max(radius, (n>1 ? (n-1)*NEED/SPAN : 0));
  // Past a point an arc stops helping; stack the overflow into extra rows.
  const perRow = Math.max(6, Math.ceil(Math.sqrt(n)*2));
  const rows = Math.ceil(n/perRow);
  ids.forEach((id,j)=>{
    const row = Math.floor(j/perRow), inRow = j%perRow;
    const m = Math.min(perRow, n-row*perRow);
    const th = m>1 ? ((inRow-(m-1)/2)/(m-1))*SPAN : 0;
    const rr = R*(rows>1 ? (0.72+0.28*(row+1)/rows) : 1);
    const x = origin.x + Math.sin(th)*rr;
    const z = origin.z + Math.max(60,rr*0.30)*(1-Math.cos(th)) + 30 + row*90;
    const y = origin.y + dy + row*70;
    P.set(id,{x,y,z});
    place({x,y,z}, childrenOf(id), Math.max(140,rr*0.55), Math.max(210,dy*0.86), depth+1);
  });
}

/* which containers are open: selected path, agent path, manual expands */
function openSet(){
  const o=new Set(['root']);
  for(const id of chain(cur())) o.add(id);
  for(const id of chain(focus.active)) o.add(id);
  for(const id of expanded) o.add(id);
  return o;
}
function depthOf(id){ return chain(id).length; }
const levelOf = kind => kind==='package' ? 1 : kind==='module' ? 2 : 3;
function visibleIds(){
  const o=openSet(), out=['root'];
  for(const [id] of P){
    if(id==='root') continue;
    const n=byId.get(id); if(!n) continue;
    const lv=levelOf(n.kind);
    const pid=n.parent==null?'root':n.parent;
    const onPath=o.has(id);
    // A level toggled off still shows along the open path, so the selected
    // symbol never vanishes because its kind is hidden.
    if(!levels[lv] && !onPath) continue;
    if(lv===1){ out.push(id); continue; }
    if(o.has(pid) || onPath) out.push(id);
  }
  return out;
}

/* ================= camera ================= */
function project(p){
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  let x=p.x-cam.tx, y=p.y-cam.ty, z=p.z-cam.tz;
  let x1=x*cy - z*sy, z1=x*sy + z*cy;
  let y1=y*cp - z1*sp, z2=y*sp + z1*cp + cam.dist;
  const f=900/Math.max(z2,120);
  const cv=el('c');
  return {x:cv.clientWidth/2 + x1*f, y:cv.clientHeight/2 + y1*f, s:f, depth:z2};
}
function fitAll(){
  const ids=visibleIds(), pts=ids.map(i=>P.get(i)).filter(Boolean);
  if(!pts.length) return;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y), zs=pts.map(p=>p.z);
  goal.tx=(Math.min(...xs)+Math.max(...xs))/2;
  goal.ty=(Math.min(...ys)+Math.max(...ys))/2;
  goal.tz=(Math.min(...zs)+Math.max(...zs))/2;
  const sx=Math.max(...xs)-Math.min(...xs), sy=Math.max(...ys)-Math.min(...ys);
  const aspect=Math.max(0.4, cv.clientWidth/Math.max(cv.clientHeight,1));
  const span=Math.max(sx/aspect, sy, 600);
  goal.dist=Math.max(700, Math.min(9000, span*1.5));
  userMoved=false;
}
function focusOn(id, tight){
  const p=P.get(id); if(!p) return;
  const d=depthOf(id);
  goal.tx=p.x; goal.ty=p.y+(tight?20:140); goal.tz=p.z+60;
  goal.dist=tight?Math.max(900,320*d):(d>=3?1400:d===2?1900:2600);
}

/* ================= render ================= */
const cv=el('c'), ctx=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;
  cv.width=r.width*d; cv.height=r.height*d; ctx.setTransform(d,0,0,d,0,0);}
new ResizeObserver(resize).observe(el('canvasWrap')); resize();

function frame(){
  for(const k of ['yaw','pitch','tx','ty','tz','dist']) cam[k]+=(goal[k]-cam[k])*.12;
  const W=cv.clientWidth,H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  const ids=visibleIds();
  const items=ids.map(id=>({id,p:P.get(id)})).filter(i=>i.p).map(i=>({...i,pr:project(i.p)}));
  const curId=cur(), curChain=new Set(chain(curId)), actChain=new Set(chain(focus.active));
  const heat=new Map(focus.trail.map(t=>[t.node,t.weight]));

  // edges parent -> child, sampled bezier
  for(const it of items){
    if(it.id==='root') continue;
    const n=byId.get(it.id); if(!n) continue;
    const pid=n.parent==null?'root':n.parent, pp=P.get(pid); if(!pp) continue;
    const lit=curChain.has(it.id)||actChain.has(it.id);
    const pts=[]; const my=(pp.y+it.p.y)/2;
    for(let i=0;i<=10;i++){const u=i/10;
      const x=pp.x+(it.p.x-pp.x)*u, z=pp.z+(it.p.z-pp.z)*u;
      const y=(1-u)*(1-u)*pp.y + 2*(1-u)*u*my + u*u*it.p.y;
      pts.push(project({x,y,z}));}
    const fog=Math.max(.15,Math.min(1,1800/it.pr.depth));
    ctx.strokeStyle = lit ? (actChain.has(it.id)?'#8a6a33':'#5a5f75') : (DIMC[n.kind]||'#2a2f40');
    ctx.globalAlpha=(lit?1:.65)*fog; ctx.lineWidth=lit?1.4:1;
    ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.stroke();
  }

  // nodes, far first
  items.sort((a,b)=>b.pr.depth-a.pr.depth);
  rects=[]; let hitNow=null;
  ctx.textBaseline='middle';
  for(const it of items){
    const n = it.id==='root' ? {kind:'project',name:(G.root||'').split('/').pop()||'repo'} : byId.get(it.id);
    if(!n) continue;
    const pr=it.pr, fog=Math.max(.12,Math.min(1,1800/pr.depth));
    const sc=Math.max(.35,Math.min(1.8, pr.s*(it.id==='root'?1.35:1.15)));
    const isAct=it.id===focus.active, isCur=it.id===curId, h=heat.get(it.id)||0;
    const far = sc<0.5 && !isAct && !isCur && !curChain.has(it.id);
    if(far){ // level of detail: distant leaves collapse to dots
      ctx.globalAlpha=.5*fog; ctx.fillStyle=DIMC[n.kind]||'#3a3f52';
      ctx.beginPath(); ctx.arc(pr.x,pr.y,1.8,0,7); ctx.fill(); continue;
    }
    const label=(n.name||'').slice(0,26);
    ctx.font=`${(12.5*sc).toFixed(1)}px ${getComputedStyle(document.body).fontFamily}`;
    const tw=ctx.measureText(label).width;
    const w=tw+34*sc, hgt=24*sc, x=pr.x-w/2, y=pr.y-hgt/2;
    rects.push({id:it.id,x,y,w,h:hgt});
    const over = mouse && mouse.x>=x && mouse.x<=x+w && mouse.y>=y && mouse.y<=y+hgt;
    if(over) hitNow=it.id;
    ctx.globalAlpha=(curChain.has(it.id)||isCur||over||h?1:.72)*fog;
    if(isAct){ctx.shadowColor='rgba(242,180,90,.5)';ctx.shadowBlur=24*sc;}
    else if(h){ctx.shadowColor=`rgba(242,180,90,${(h*.35).toFixed(2)})`;ctx.shadowBlur=16*sc;}
    else ctx.shadowBlur=0;
    ctx.fillStyle=isAct?'#3a2d17':isCur?'#171a25':'#0e1017';
    ctx.beginPath(); ctx.roundRect(x,y,w,hgt,7*sc); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=isAct?'#f2b45a':(isCur||over)?'#7a7f95':(DIMC[n.kind]||'#2a2f40');
    ctx.lineWidth=(isCur||isAct)?1.4:1; ctx.stroke();
    // kind glyph
    const gx=x+11*sc, gy=pr.y, gr=4*sc, kc=KC[n.kind]||'#7a7f95';
    ctx.beginPath();
    if(n.kind==='class'){ctx.moveTo(gx,gy-gr);ctx.lineTo(gx+gr,gy);ctx.lineTo(gx,gy+gr);ctx.lineTo(gx-gr,gy);ctx.closePath();ctx.strokeStyle=kc;ctx.stroke();}
    else if(n.kind==='route'){ctx.arc(gx,gy,gr,0,7);ctx.strokeStyle=kc;ctx.stroke();}
    else if(n.kind==='module'){ctx.fillStyle=kc;ctx.fillRect(gx-gr,gy-gr,gr*2,gr*2);}
    else if(n.kind==='package'){ctx.strokeStyle=kc;ctx.strokeRect(gx-gr,gy-gr,gr*2,gr*2);}
    else if(n.kind==='project'){ctx.fillStyle='#f2b45a';ctx.fillRect(gx-gr,gy-gr,gr*2,gr*2);}
    else {ctx.fillStyle='#7a7f95';ctx.arc(gx,gy,gr*.7,0,7);ctx.fill();}
    ctx.fillStyle=isAct?'#f2b45a':isCur?'#e9e9ed':(KC[n.kind]||'#9aa2b4');
    ctx.fillText(label, x+20*sc, gy+.5);
  }
  ctx.globalAlpha=1;
  hit=hitNow; cv.style.cursor=hitNow?'pointer':'grab';
  if(hitNow!==hoverId){ hoverId=hitNow; }
  requestAnimationFrame(frame);
}

/* ================= interaction ================= */
let drag=null;
cv.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,moved:false};cv.style.cursor='grabbing';};
addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  mouse={x:e.clientX-r.left,y:e.clientY-r.top};
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
  goal.yaw+=dx*.005; goal.pitch=Math.max(-.5,Math.min(1.1,goal.pitch+dy*.004));
  drag.x=e.clientX; drag.y=e.clientY; userMoved=true;
});
addEventListener('mouseup',()=>{
  if(drag&&!drag.moved&&hit!=null){
    if(hit==='root'){ sel=null; expanded.clear(); setFollow(false); fitAll(); renderAll(); }
    else select(hit,true);
  }
  drag=null; cv.style.cursor='grab';
});
cv.onmouseleave=()=>{drag=null;mouse=null;};
cv.onwheel=e=>{e.preventDefault();goal.dist=Math.max(500,Math.min(6000,goal.dist*(1+e.deltaY*.0012)));userMoved=true;};
cv.ondblclick=()=>{ if(hit!=null&&hit!=='root'){ expanded.has(hit)?expanded.delete(hit):expanded.add(hit); renderAll(); } };

el('fitAll').onclick=()=>{fitAll();};
el('fitSel').onclick=()=>{const c=cur(); if(c!=null) focusOn(c,true);};
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=+b.dataset.lvl; if(l===0) return;
  levels[l]=!levels[l]; b.classList.toggle('on',levels[l]); if(!userMoved) fitAll();
});

/* ---- search ---- */
let suggIdx=-1, suggList=[];
el('search').oninput=e=>{
  const q=e.target.value.toLowerCase().trim();
  if(!q){ el('sugg').style.display='none'; suggList=[]; return; }
  suggList=G.nodes.filter(n=>n.name.toLowerCase().includes(q)||n.qualified_name.toLowerCase().includes(q))
    .sort((a,b)=>a.name.length-b.name.length).slice(0,40);
  suggIdx=0;
  el('sugg').innerHTML=suggList.map((n,i)=>
    `<div class="${i===0?'on':''}" data-id="${n.id}"><span class="k">${n.kind[0]}</span>${esc(n.name)}
     <span class="k" style="float:right">${esc(shortf(n.file))}</span></div>`).join('');
  el('sugg').style.display=suggList.length?'block':'none';
  el('sugg').querySelectorAll('[data-id]').forEach(d=>d.onclick=()=>pick(+d.dataset.id));
};
function pick(id){ el('sugg').style.display='none'; el('search').value=''; select(id,true); focusOn(id,true); }
el('search').onkeydown=e=>{
  if(!suggList.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
    suggIdx=(suggIdx+(e.key==='ArrowDown'?1:-1)+suggList.length)%suggList.length;
    el('sugg').querySelectorAll('div').forEach((d,i)=>d.classList.toggle('on',i===suggIdx));}
  if(e.key==='Enter'){e.preventDefault(); pick(suggList[suggIdx].id);}
  if(e.key==='Escape'){el('sugg').style.display='none'; e.target.blur();}
};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='/'){e.preventDefault();el('search').focus();}
  if(e.key==='f') setFollow(!focus.following);
  if(e.key==='Escape'){const n=byId.get(cur()); if(n&&n.parent!=null) select(n.parent,true);}
});

/* ================= panel ================= */
function pathChips(id){
  const path=[id], seen=new Set(path); let hop=id,g=0;
  while(g++<6){
    const ups=(rcalls.get(hop)||[]).filter(x=>!seen.has(x));
    if(!ups.length) break;
    const rt=ups.find(x=>(byId.get(x)||{}).kind==='route');
    hop = rt!==undefined?rt:ups[0];
    path.unshift(hop); seen.add(hop);
    if(rt!==undefined) break;
  }
  const top=byId.get(path[0])||{};
  const note = path.length===1 ? 'nothing indexed calls this'
    : top.kind==='route' ? 'from a route'
    : top.name==='main' ? "from the binary's entry point"
    : `${path.length-1} hop${path.length>2?'s':''} up, then unknown`;
  return {path, note};
}
function renderPanel(d){
  const id=cur();
  if(!d||d.id!==id) return;
  detail=d;
  const n=byId.get(id)||{};
  const total=d.resolved_calls+d.unresolved_calls;
  const pct=total?Math.round(100*d.resolved_calls/total):100;
  const callers=(rcalls.get(id)||[]), callees=(calls.get(id)||[]);
  const nm=x=>esc((byId.get(x)||{}).name||'?');
  const {path,note}=pathChips(id);

  const whatIs = d.doc ? `<div class="prose">${esc(d.doc)}</div>`
    : d.composition ? `<div class="prose">Holds ${esc(d.composition)}.</div>`
    : `<div class="prose" style="color:var(--dimmer)">No doc comment here.</div>`;
  const summary = (callers.length||callees.length)
    ? `<div class="prose" style="margin-top:8px">${callers.length?`Called by ${callers.slice(0,3).map(nm).join(', ')}.`:''}
       ${callees.length?` Calls ${callees.slice(0,3).map(nm).join(', ')}.`:''}</div>` : '';

  el('panel').innerHTML =
   `<div class="sec"><h4>what this is</h4>
      ${whatIs}
      ${d.signature?`<div class="sig">${esc(d.signature)}</div>`:''}
      ${summary}
      <div class="loc">${esc(shortf(d.file))}:${d.line_start} · <a id="oe">open in editor ↗</a></div>
    </div>
    <div class="sec"><h4>how you get here <em>${esc(note)}</em></h4>
      <div class="chain">${path.map((p,i)=>{
        const pn=byId.get(p)||{}; const last=i===path.length-1;
        return `<span class="hop ${last?'last':''} ${pn.kind==='route'?'route':''}" data-go="${p}">${esc(pn.name)}</span>`
          + (last?'':'<span class="arrow">→</span>');}).join('')}</div>
    </div>
    <div class="sec"><h4>reached from</h4>
      ${d.routes.length
        ? `<div class="acts">${d.routes.map(r=>`<button data-go="${r}">${nm(r)}</button>`).join('')}</div>`
        : `<div class="prose"><b class="warnt">No route found.</b> That means unknown, not
            unreachable — call edges are read from syntax, not types.</div>`}
    </div>
    <div class="sec"><h4>what codemap knows here</h4>
      <div class="stats">
        <div class="stat"><b>${callers.length}</b><span>callers</span></div>
        <div class="stat"><b>${d.resolved_calls}</b><span>calls resolved</span></div>
        <div class="stat u"><b>${d.unresolved_calls}</b><span>unresolved</span></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="prose">${pct}% of call sites in this node resolved.${d.unresolved_calls?
        ' The rest go through values whose type is not inferred, so a caller or route may exist that codemap cannot see.':''}</div>
    </div>
    <div class="sec"><h4>dependencies</h4>
      ${d.dependencies.length
        ? `<div class="deps">${d.dependencies.map(x=>`<span class="dtag">${esc(x)}</span>`).join('')}</div>`
        : `<div class="prose">Standard library and this repo only — nothing external here.</div>`}
    </div>
    ${d.source?`<div class="sec"><h4>source</h4><pre>${esc(d.source)}</pre></div>`:''}
    <div class="sec"><h4>ask the agent</h4>
      <div class="acts">${['explain','write tests','find bugs','refactor','trace callers']
        .map(i=>`<button data-i="${i}">${i}</button>`).join('')}</div>
      <div class="prose" style="margin-top:8px">Types the prompt into your agent's pane.
        Nothing is submitted until you press Enter.</div>
    </div>`;
  el('panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(+b.dataset.go,true));
  el('panel').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    send({type:'send_to_agent',prompt:`${b.dataset.i} ${d.qualified_name} (${d.file}:${d.line_start})`});
    const t=b.textContent;b.textContent='sent ✓';setTimeout(()=>b.textContent=t,1200);});
  const oe=el('oe'); if(oe) oe.onclick=()=>send({type:'open_editor',file:d.file,line:d.line_start});
}

/* ================= chrome ================= */
function renderHead(){
  const id=cur(), n=byId.get(id);
  el('crumbs').innerHTML = id==null ? '' : chain(id).map((c,i,a)=>{
    const nn=byId.get(c)||{};
    return i===a.length-1 ? `<b>${esc(nn.name)}</b>` : `<span data-c="${c}">${esc(nn.name)}</span>`;
  }).join(' <span style="color:#3a4157">/</span> ');
  el('crumbs').querySelectorAll('[data-c]').forEach(s=>s.onclick=()=>select(+s.dataset.c,true));
  el('title').innerHTML = n
    ? `<h1>${esc(n.name)}</h1><span class="badge">${n.kind}</span>` +
      (focus.active===id?`<span id="here">the agent is here now</span>`:'')
    : `<h1 style="color:var(--dimmer);font-size:20px">waiting for your agent…</h1>`;
}
function renderTrail(){
  const items=focus.trail.map(t=>{
    const n=byId.get(t.node); if(!n) return '';
    const a=t.ago_secs;
    const ago=a<2?'now':a<60?`${a}s ago`:a<3600?`${Math.round(a/60)}m ago`:`${Math.round(a/3600)}h ago`;
    return `<div class="chip" data-go="${t.node}" style="opacity:${(.4+t.weight*.6).toFixed(2)}">
      <i style="opacity:${t.weight.toFixed(2)}"></i>${esc(n.name)}<span class="ago">${ago}</span></div>`;
  }).filter(Boolean).join('');
  el('trail').innerHTML=`<div class="th"><span>session trail</span><span>fades on a 90s half-life</span></div>
    <div class="chips">${items||'<div style="color:var(--dimmer);font-size:12px">nothing yet — the trail fills as your agent works</div>'}</div>`;
  el('trail').querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>select(+c.dataset.go,true));
}
function renderAll(){ renderHead(); renderTrail(); }

function select(id,detach){
  sel=id;
  if(detach) setFollow(false);
  for(const a of chain(id)) expanded.add(a);
  send({type:'detail',id});
  if(!userMoved) focusOn(id,true);
  renderAll();
}

function applyFocus(f){
  focus=f;
  const b=el('follow');
  b.classList.toggle('on',f.following); b.textContent=f.following?'Following':'Detached';
  const a=f.last_event_secs;
  const ago=a==null?'':a<2?'just now':a<60?`${a}s ago`:`${Math.round(a/60)}m ago`;
  el('agentst').innerHTML = f.active==null
    ? `<span class="dot off"></span>waiting for your agent`
    : `<span class="dot ${f.following?'on':'off'}"></span>${f.following?'Following':'Detached ·'} <b>${esc(f.agent)}</b>${ago?` · last event ${ago}`:''}`;
  if(f.following&&f.active!=null){ sel=null; for(const x of chain(f.active)) expanded.add(x); if(!userMoved) focusOn(f.active,true); }
  const showing=cur();
  if(showing!=null&&(!detail||detail.id!==showing)) send({type:'detail',id:showing});
  renderAll();
}
function setFollow(on){ if(focus.following!==on) send({type:'follow',on}); }
el('follow').onclick=()=>setFollow(!focus.following);

function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.type==='graph') ingest(m);
    else if(m.type==='focus') applyFocus(m);
    else if(m.type==='detail') renderPanel(m);};
  ws.onclose=()=>{el('counts').textContent='disconnected — retrying';setTimeout(connect,1200);};
}
connect(); frame();
setInterval(()=>{ if(focus.trail.length) renderTrail(); },5000);
</script>
