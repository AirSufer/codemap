[workspace]
members = [
    "crates/codemap-graph",
    "crates/codemap-index",
    "crates/codemap-daemon",
    "crates/codemap-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.96"

[workspace.dependencies]
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
axum = { version = "0.8", features = ["ws"] }
notify = "8.2"
ratatui = "0.30"
crossterm = "0.29"
futures-util = "0.3"
dirs = "7"
